services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka-aula
    hostname: kafka-aula
    ports:
      - "9092:9092"       # listener interno (entre containers)
      - "9094:9094"       # listener externo (para o notebook rodando no host)
    environment:
      # --- Modo KRaft: Kafka roda sem precisar de ZooKeeper ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-aula:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-aula:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Facilita testes em sala de aula (1 único broker)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data

  # Interface web opcional, útil para os alunos visualizarem tópicos/partições/mensagens
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-aula
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=aula-dce540
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-aula:9092

volumes:
  kafka_data:
